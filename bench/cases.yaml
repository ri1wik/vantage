# vantage-bench: 60 cases across four tiers.
#
# Tier 1 semantic_accuracy   (24) does the answer match an independently written gold query
# Tier 2 self_correction     (12) does an injected first-attempt fault get diagnosed and repaired
# Tier 3 refusal             (12) is the right question declined, for the right reason, and the
#                                 wrong one answered (4 of these are traps that must NOT refuse)
# Tier 4 memo_faithfulness   (12) is every number in the memo traceable to the result set
#
# gold_sql is hand-written against the schema, not generated by Vantage. Comparison is
# order-insensitive on the row set with floats rounded to 2dp, so aliasing and ordering
# differences do not count against a correct answer.

# ---------------------------------------------------------------- tier 1 ----
- id: t1-01
  tier: semantic_accuracy
  question: What was total revenue by product category in 2024?
  gold_tables: [order_items, orders, products, categories]
  gold_sql: |
    SELECT c.category_name, ROUND(SUM(oi.line_total), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE strftime('%Y', o.order_date) = '2024'
    GROUP BY 1

- id: t1-02
  tier: semantic_accuracy
  question: Top 5 products by units sold
  gold_tables: [order_items, products]
  gold_sql: |
    SELECT p.product_name, ROUND(SUM(oi.quantity), 2) AS units
    FROM order_items oi
    JOIN products p ON p.product_id = oi.product_id
    GROUP BY 1 ORDER BY units DESC LIMIT 5

- id: t1-03
  tier: semantic_accuracy
  question: Revenue by sales channel
  gold_tables: [order_items, orders]
  gold_sql: |
    SELECT o.channel, ROUND(SUM(oi.line_total), 2) AS revenue
    FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
    GROUP BY 1

- id: t1-04
  tier: semantic_accuracy
  question: Refund amount by return reason
  gold_tables: [returns]
  gold_sql: |
    SELECT r.reason, ROUND(SUM(r.refund_amount), 2) AS refund_amount
    FROM returns r GROUP BY 1

- id: t1-05
  tier: semantic_accuracy
  question: Which carrier has the most lost shipments?
  gold_tables: [shipments]
  gold_sql: |
    SELECT s.carrier, COUNT(s.shipment_id) AS shipment_count
    FROM shipments s WHERE s.status = 'lost'
    GROUP BY 1 ORDER BY shipment_count DESC LIMIT 1

- id: t1-06
  tier: semantic_accuracy
  question: Average delivery days by carrier
  gold_tables: [shipments]
  gold_sql: |
    SELECT s.carrier,
           ROUND(AVG(julianday(s.delivered_ts) - julianday(s.shipped_ts)), 2) AS avg_delivery_days
    FROM shipments s WHERE s.delivered_ts IS NOT NULL
    GROUP BY 1

- id: t1-07
  tier: semantic_accuracy
  question: Revenue by customer loyalty tier
  gold_tables: [order_items, orders, customers]
  gold_sql: |
    SELECT cu.loyalty_tier, ROUND(SUM(oi.line_total), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN customers cu ON cu.customer_id = o.customer_id
    GROUP BY 1

- id: t1-08
  tier: semantic_accuracy
  question: Monthly revenue for 2025
  gold_tables: [order_items, orders]
  gold_sql: |
    SELECT strftime('%Y-%m', o.order_date) AS month, ROUND(SUM(oi.line_total), 2) AS revenue
    FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
    WHERE strftime('%Y', o.order_date) = '2025'
    GROUP BY 1

- id: t1-09
  tier: semantic_accuracy
  question: Payment failure rate by processor
  gold_tables: [payments]
  gold_sql: |
    SELECT p.processor,
           ROUND(1.0 * SUM(CASE WHEN p.status = 'failed' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4)
             AS failure_rate
    FROM payments p GROUP BY 1

- id: t1-10
  tier: semantic_accuracy
  question: Average supplier rating by supplier country
  gold_tables: [suppliers]
  gold_sql: |
    SELECT s.country, ROUND(AVG(s.rating), 2) AS avg_rating
    FROM suppliers s GROUP BY 1

- id: t1-11
  tier: semantic_accuracy
  question: How many orders were placed by order status?
  gold_tables: [orders]
  gold_sql: |
    SELECT o.status, COUNT(DISTINCT o.order_id) AS order_count
    FROM orders o GROUP BY 1

- id: t1-12
  tier: semantic_accuracy
  question: Revenue by store region
  gold_tables: [order_items, orders, stores]
  gold_sql: |
    SELECT st.region, ROUND(SUM(oi.line_total), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN stores st ON st.store_id = o.store_id
    GROUP BY 1

- id: t1-13
  tier: semantic_accuracy
  question: Units sold by product department
  gold_tables: [order_items, products, categories]
  gold_sql: |
    SELECT c.department, ROUND(SUM(oi.quantity), 2) AS units
    FROM order_items oi
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    GROUP BY 1

- id: t1-14
  tier: semantic_accuracy
  question: Average order value by customer segment
  gold_tables: [order_items, orders, customers]
  gold_sql: |
    SELECT cu.segment,
           ROUND(1.0 * SUM(oi.line_total) / NULLIF(COUNT(DISTINCT o.order_id), 0), 4) AS average_order_value
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN customers cu ON cu.customer_id = o.customer_id
    GROUP BY 1

- id: t1-15
  tier: semantic_accuracy
  question: Discount amount by promo code
  gold_tables: [order_items, orders]
  gold_sql: |
    SELECT o.promo_code, ROUND(SUM(oi.discount_amount), 2) AS discount_amount
    FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
    GROUP BY 1

- id: t1-16
  tier: semantic_accuracy
  question: Gross margin by product department
  gold_tables: [order_items, products, categories]
  gold_sql: |
    SELECT c.department,
           ROUND(SUM(oi.line_total - p.unit_cost * oi.quantity), 2) AS gross_margin
    FROM order_items oi
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    GROUP BY 1

- id: t1-17
  tier: semantic_accuracy
  question: Return rate by product department
  gold_tables: [order_items, returns, products, categories]
  gold_sql: |
    SELECT c.department,
           ROUND(1.0 * SUM(COALESCE(r.quantity, 0)) / NULLIF(SUM(oi.quantity), 0), 4) AS return_rate
    FROM order_items oi
    LEFT JOIN returns r ON r.order_item_id = oi.order_item_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    GROUP BY 1

- id: t1-18
  tier: semantic_accuracy
  question: Shipping cost by carrier in 2025
  gold_tables: [shipments]
  gold_sql: |
    SELECT s.carrier, ROUND(SUM(s.ship_cost), 2) AS shipping_cost
    FROM shipments s WHERE strftime('%Y', s.shipped_ts) = '2025'
    GROUP BY 1

- id: t1-19
  tier: semantic_accuracy
  question: How many products are inactive?
  gold_tables: [products]
  gold_sql: |
    SELECT COUNT(p.product_id) AS product_count FROM products p WHERE p.is_active = 0

- id: t1-20
  tier: semantic_accuracy
  question: How many customers are in each loyalty tier?
  gold_tables: [customers]
  gold_sql: |
    SELECT cu.loyalty_tier, COUNT(DISTINCT cu.customer_id) AS customer_count
