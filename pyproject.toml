[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.1.0"
description = "Vantage: a self-correcting multi-agent data analyst that turns plain-English questions into AST-guarded read-only SQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ritwik Rituparn", email = "ritwik1521@gmail.com" }]
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "sqlglot>=25",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "rich>=13",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
mcp = ["mcp>=1.0"]

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The schema DDL and the business glossary ship with the package: the catalog
# reads both at import time, so a wheel without them cannot build a catalog.
vantage = ["warehouse/*.sql", "warehouse/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# `bench` is a repo-root package, not an installed one, and tests/test_bench.py
# imports it. `python -m pytest` puts the CWD on sys.path but the `pytest`
# console script does not, so pin it here and the suite runs under both.
pythonpath = ["."]

[tool.coverage.run]
source = ["src/vantage"]
