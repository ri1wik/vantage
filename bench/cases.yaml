    SELECT s.status, COUNT(s.shipment_id) AS shipment_count FROM shipments s GROUP BY 1

- id: t1-23
  tier: semantic_accuracy
  question: Average lead time by supplier region
  gold_tables: [suppliers]
  gold_sql: |
    SELECT s.region, ROUND(AVG(s.lead_time_days), 2) AS avg_lead_time_days
    FROM suppliers s GROUP BY 1

- id: t1-24
  tier: semantic_accuracy
  question: Top 3 store regions by revenue
  gold_tables: [order_items, orders, stores]
  gold_sql: |
    SELECT st.region, ROUND(SUM(oi.line_total), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN stores st ON st.store_id = o.store_id
    GROUP BY 1 ORDER BY revenue DESC LIMIT 3

